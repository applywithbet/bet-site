<!-- @dsCard group="Actions" height=110 order=2 -->
<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center">
  <button class="bet-icon-btn bet-theme-toggle" type="button" aria-label="Switch theme">{{icon:sun:i-sun is-drawn}}{{icon:moon:i-moon is-drawn}}</button>
  <button class="bet-icon-btn bet-icon-btn-lg" type="button" aria-label="Back to all jobs">{{icon:arrow-left}}</button>
  <button class="bet-icon-btn bet-icon-btn-xl" type="button" aria-label="Not interested">{{icon:close}}</button>
  <button class="bet-save" type="button" aria-pressed="false" aria-label="Save job">{{icon:bookmark}}</button>
  <button class="bet-save" type="button" aria-pressed="true" aria-label="Saved">{{icon:bookmark}}</button>
</div>
