<!-- @dsCard group="Forms" height=520 order=1 -->
<div class="bet-tray" style="max-width:640px">
  <div class="bet-panel">
    <form class="bet-form" onsubmit="return false">
      <div class="bet-form-grid">
        <div class="bet-field-row"><label class="bet-field-label" for="fc-name">Full name</label><input class="bet-input" id="fc-name" placeholder="Sam Taylor"></div>
        <div class="bet-field-row"><label class="bet-field-label" for="fc-co">Company</label><input class="bet-input" id="fc-co" placeholder="Where you work"></div>
        <div class="bet-field-row is-wide"><label class="bet-field-label" for="fc-mail">Work email</label><input class="bet-input" id="fc-mail" type="email" placeholder="you@company.com" aria-invalid="true" aria-describedby="fc-mail-err"><p class="bet-err" id="fc-mail-err">Enter an email address we can reach you at.</p></div>
      </div>
      <div class="bet-check"><input type="checkbox" id="fc-ok"><label for="fc-ok">I agree to the terms and the privacy policy.</label></div>
      <button class="bet-btn bet-btn-block" type="submit">Book a demo</button>
    </form>
  </div>
</div>
