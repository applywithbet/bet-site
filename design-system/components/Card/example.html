<!-- @dsCard group="Surfaces" height=380 order=3 -->
<article class="bet-card" style="display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);overflow:hidden">
  <div style="padding:22px 28px 28px"><dl class="bet-dl">
    <div><dt>Location</dt><dd>New York, NY</dd></div>
    <div><dt>Employment type</dt><dd>Full time</dd></div>
    <div><dt>Compensation</dt><dd>$140K – $190K</dd></div>
  </dl></div>
  <div style="padding:32px 36px 36px;display:grid;gap:12px;align-content:start">
    <h2 class="bet-title">What is Bet?</h2>
    <p style="margin:0;font-size:1.02rem;line-height:1.68;color:color-mix(in srgb,var(--ink) 88%,var(--surface));max-width:62ch">Bet is a job board that applies for you. You import your resume, answer a few questions, and Bet builds you a dashboard of jobs picked for you, with new ones coming in every hour.</p>
    <a class="bet-btn bet-btn-block" href="#" style="margin-top:14px">Apply for this job</a>
  </div>
</article>
