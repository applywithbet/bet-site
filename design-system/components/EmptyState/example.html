<!-- @dsCard group="Bet" height=300 order=5 -->
<div style="display:grid;gap:16px;max-width:640px">
  <div class="bet-empty">
    <span class="bet-eco" aria-hidden="true">{{friend:fish}}</span>
    <div class="bet-empty-t">
      <p class="bet-empty-h">Your jobs are on the way</p>
      <p>I'm searching your cities now. The first ones show up within the hour.</p>
      <button class="bet-btn bet-btn-outline" type="button">Search the job bank</button>
    </div>
  </div>
  <div class="bet-empty">
    <span class="bet-tango" aria-hidden="true">{{friend:crab}}</span>
    <div class="bet-empty-t">
      <p class="bet-empty-h">Nothing tracked yet</p>
      <p>Mark a job applied and I'll keep the date.</p>
    </div>
  </div>
</div>
