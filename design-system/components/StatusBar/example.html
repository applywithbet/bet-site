<div style="display:grid;gap:14px;max-width:380px">
  <div class="bet-statusbar">{{bet:bet-32}}<span class="bet-statusbar-text"><b>Filling in your application</b><span>9 of 14 fields on Workday</span></span><span class="bet-statusbar-ring" style="--p:64"><svg class="ring" viewBox="0 0 32 32" aria-hidden="true"><circle class="trk" cx="16" cy="16" r="13" pathLength="100"/><circle class="bar" cx="16" cy="16" r="13" pathLength="100"/></svg><span class="ok">{{icon:check:is-drawn}}</span></span></div>
  <div class="bet-statusbar is-ready">{{bet:bet-32 is-standing}}<span class="bet-statusbar-text"><b>Ready for you to review</b><span>Check it, then press Submit</span></span><span class="bet-statusbar-ring" style="--p:100"><svg class="ring" viewBox="0 0 32 32" aria-hidden="true"><circle class="trk" cx="16" cy="16" r="13" pathLength="100"/><circle class="bar" cx="16" cy="16" r="13" pathLength="100"/></svg><span class="ok">{{icon:check:is-drawn}}</span></span></div>
</div>
