<!-- @dsCard group="Actions" height=260 order=1 -->
<div style="display:grid;gap:22px">
  <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
    <a class="bet-btn bet-btn-lg" href="#">Book a demo<span class="bet-btn-arrow">{{icon:arrow-right}}</span></a>
    <a class="bet-btn bet-btn-lg bet-btn-ghost" href="#">See how it works</a>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
    <button class="bet-btn" type="button">Apply with Bet<span class="bet-btn-arrow">{{icon:arrow-right}}</span></button>
    <button class="bet-btn bet-btn-outline" type="button">Not now</button>
    <button class="bet-btn bet-btn-sm" type="button">Book a demo</button>
    <button class="bet-btn bet-btn-light" type="button">{{icon:upload}}Upload file</button>
    <button class="bet-btn bet-btn-quiet" type="button">Undo</button>
    <button class="bet-btn" type="button" disabled>Sending…</button>
  </div>
  <button class="bet-btn bet-btn-block" type="button">Submit application</button>
</div>
