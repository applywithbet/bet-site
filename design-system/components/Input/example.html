<!-- @dsCard group="Forms" height=520 order=2 -->
<div style="display:grid;gap:22px;max-width:560px">
  <div class="bet-search">{{icon:search}}<input type="search" placeholder="Search jobs, companies, cities" aria-label="Search jobs"></div>
  <div class="bet-field-row bet-field-lg"><label class="bet-field-label" for="in-why">Why Bet? <span class="bet-req">*</span></label><p class="bet-help">A few sentences is plenty.</p><textarea class="bet-input bet-input-outline" id="in-why" placeholder="Tell us what you'd build first"></textarea></div>
  <div class="bet-form-grid">
    <div class="bet-field-row bet-field-lg"><label class="bet-field-label" for="in-yrs">Years of experience</label><select class="bet-input bet-input-outline bet-select" id="in-yrs"><option>1–2 years</option><option>3–5 years</option><option>6+ years</option></select></div>
    <div class="bet-field-row bet-field-lg"><label class="bet-field-label" for="in-li">LinkedIn</label><input class="bet-input bet-input-outline" id="in-li" placeholder="linkedin.com/in/you"></div>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><select class="bet-input bet-input-sm bet-select" style="width:auto" aria-label="City"><option>All my cities</option><option>New York</option></select><select class="bet-input bet-input-sm bet-select" style="width:auto" aria-label="Order"><option>Best fit first</option><option>Newest first</option></select></div>
</div>
